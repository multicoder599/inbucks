<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InnBucks Loan Application</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#1f2235;
}

/* ===== CARD ===== */
.card{
  width:92%;
  max-width:420px;
  background:#232744;
  border-radius:26px;
  padding:30px 25px;
  box-shadow:0 25px 60px rgba(0,0,0,.6);
  color:#fff;
  animation:cardIn .8s ease;
  border:1px solid rgba(255,255,255,.08);
}

/* LOGO */
.logo{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-bottom:25px;
}

.dots{
  display:grid;
  grid-template-columns:repeat(2,12px);
  gap:5px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
}
.dot1{background:#ffb300}
.dot2{background:#8e24aa}
.dot3{background:#43a047}
.dot4{background:#e53935}

.logo h2{
  font-weight:600;
  letter-spacing:.5px;
}

/* HEAD */
h2{
  text-align:center;
  margin-bottom:6px;
}

.sub{
  text-align:center;
  font-size:14px;
  color:#cbd5f5;
  margin-bottom:28px;
}

/* ===== INPUTS ===== */
.field{
  margin-bottom:18px;
}

label{
  font-size:13px;
  color:#aab2ff;
}

input, select{
  width:100%;
  padding:14px;
  margin-top:6px;
  border:none;
  border-radius:14px;
  outline:none;
  font-size:14px;
  background:#1f2235;
  color:#fff;
  border:1px solid rgba(255,255,255,.1);
}

input::placeholder{
  color:#7c86d6;
}

/* ===== PHONE ===== */
.phone{
  display:flex;
  gap:8px;
}

.phone span{
  background:#355d8c;
  padding:14px;
  border-radius:14px;
  font-weight:600;
}

/* ===== BUTTON ===== */
button{
  width:100%;
  padding:15px;
  margin-top:14px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#355d8c,#4dabf7);
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  transition:.3s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(77,171,247,.45);
}

button.loading{
  pointer-events:none;
  opacity:.85;
}

/* Loader */
.loader{
  width:18px;
  height:18px;
  border:3px solid rgba(255,255,255,.4);
  border-top:3px solid #fff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  display:none;
}

button.loading .loader{
  display:block;
}

/* ===== ANIMATIONS ===== */
@keyframes spin{
  to{transform:rotate(360deg)}
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(40px) scale(.95)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
</style>
</head>

<body>

<div class="card">

  <!-- LOGO -->
  <div class="logo">
    <div class="dots">
      <div class="dot dot1"></div>
      <div class="dot dot2"></div>
      <div class="dot dot3"></div>
      <div class="dot dot4"></div>
    </div>
    <h2>InnBucks</h2>
  </div>

  <h2>Loan Application</h2>
  <div class="sub">Apply instantly. No paperwork.</div>

  <form id="loanForm">

    <!-- NAME -->
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="fullName" placeholder="Enter your full name" required>
    </div>

    <!-- PHONE -->
    <div class="field">
      <label>Phone Number</label>
      <div class="phone">
        <span>🇿🇼 +263</span>
        <input type="text" name="phone" maxlength="10" inputmode="numeric"
         placeholder="Enter phone number" required>
      </div>
    </div>

    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" required placeholder="you@email.com">
    </div>

    <div class="field">
      <label>Loan Amount (USD)</label>
      <input type="number" id="loanAmount" required placeholder="50 - 5000">
    </div>

    <div class="field">
      <label>Purpose of Loan</label>
      <select required>
        <option value="">Select purpose</option>
        <option>Personal</option>
        <option>Business</option>
        <option>Emergency</option>
        <option>Education</option>
      </select>
    </div>

    <div class="field">
      <label>Monthly Income (USD)</label>
      <input type="number" required placeholder="e.g. 300">
    </div>

    <button type="submit" id="submitBtn">
      Submit Application
      <div class="loader"></div>
    </button>

  </form>
</div>

<script>
const form = document.getElementById("loanForm");
const btn = document.getElementById("submitBtn");

form.addEventListener("submit", e => {
  e.preventDefault();

  btn.classList.add("loading");
  btn.firstChild.textContent = "Submitting";

  // VALUES
  const fullName = document.getElementById("fullName").value;
  const phone = document.querySelector('input[name="phone"]').value;
  const email = document.getElementById("email").value;
  const loanAmount = document.getElementById("loanAmount").value;

  // SAVE
  localStorage.setItem("fullName", fullName);
  localStorage.setItem("phone", phone);
  localStorage.setItem("email", email);
  localStorage.setItem("loanAmount", loanAmount);

  setTimeout(() => {
    window.location.href = "processing.html";
  }, 1800);
});

// numeric phone only
document.querySelector('input[name="phone"]').addEventListener('input', function () {
  this.value = this.value.replace(/\D/g, '').slice(0, 10);
});
</script>

</body>
</html>
