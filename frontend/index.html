<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>InnBucks Loan Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  background:#1f2235;
  min-height:100vh;
  color:#fff;
}

/* ===== HEADER ===== */
.header{
  padding:16px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#232744;
}

/* LOGO */
.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.dots{
  display:grid;
  grid-template-columns:repeat(2,10px);
  gap:4px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.dot1{background:#ffb300;}
.dot2{background:#8e24aa;}
.dot3{background:#43a047;}
.dot4{background:#e53935;}

.logo h2{
  font-size:20px;
  font-weight:600;
  letter-spacing:.5px;
}

.menu{
  font-size:22px;
}

/* ===== HERO ===== */
.hero{
  background:linear-gradient(135deg,#2a2f4a,#1f2235);
  border-radius:20px;
  margin:18px;
  padding:26px 22px;
  box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.hero h1{
  font-size:24px;
  margin-bottom:6px;
}

.hero p{
  color:#cbd5f5;
  font-size:14px;
}

/* ===== CALCULATOR ===== */
.calc{
  background:#232744;
  border-radius:18px;
  padding:22px;
  margin-top:22px;
  border:1px solid rgba(255,255,255,.08);
}

.calc h3{
  margin-bottom:18px;
  font-size:18px;
}

/* ===== SLIDER BLOCK ===== */
.block{
  margin-bottom:22px;
}

.block-top{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:8px;
}

.value{
  color:#4dabf7;
  font-weight:600;
}

input[type=range]{
  width:100%;
  appearance:none;
  height:6px;
  border-radius:6px;
  background:#3a4170;
  outline:none;
}

input[type=range]::-webkit-slider-thumb{
  appearance:none;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#4dabf7;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.5);
}

.range-labels{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#aab2ff;
  margin-top:6px;
}

/* ===== RESULT ===== */
.result{
  background:#1f2235;
  border-radius:14px;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  border:1px solid rgba(255,255,255,.08);
}

.result span{
  font-size:14px;
  color:#cbd5f5;
}

.result strong{
  font-size:24px;
  color:#4dabf7;
}

/* ===== APPLY BUTTON ===== */
.apply{
  width:100%;
  margin-top:26px;
  padding:15px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#355d8c,#4dabf7);
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

.apply:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(77,171,247,.45);
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <div class="logo">
    <div class="dots">
      <div class="dot dot1"></div>
      <div class="dot dot2"></div>
      <div class="dot dot3"></div>
      <div class="dot dot4"></div>
    </div>
    <h2>InnBucks</h2>
  </div>

  <div class="menu">☰</div>
</div>

<!-- HERO -->
<div class="hero">
  <h1>Loan Calculator</h1>
  <p>Calculate your repayments instantly with InnBucks</p>

  <!-- CALCULATOR -->
  <div class="calc">
    <h3>Plan your loan</h3>

    <!-- AMOUNT -->
    <div class="block">
      <div class="block-top">
        <span>Loan Amount</span>
        <span class="value" id="amountVal">$5,000</span>
      </div>
      <input type="range" id="amount" min="100" max="5000" step="100" value="5000">
      <div class="range-labels">
        <span>$100</span>
        <span>$5,000</span>
      </div>
    </div>

    <!-- TERM -->
    <div class="block">
      <div class="block-top">
        <span>Loan Term</span>
        <span class="value" id="termVal">12 months</span>
      </div>
      <input type="range" id="term" min="1" max="12" step="1" value="12">
      <div class="range-labels">
        <span>1 month</span>
        <span>12 months</span>
      </div>
    </div>

    <!-- MONTHLY -->
    <div class="result">
      <span>Monthly Payment</span>
      <strong id="monthly">$0.00</strong>
    </div>

    <!-- APPLY -->
    <button class="apply" onclick="applyNow()">Apply Now</button>
  </div>
</div>

<script>
const amount = document.getElementById("amount");
const term = document.getElementById("term");
const amountVal = document.getElementById("amountVal");
const termVal = document.getElementById("termVal");
const monthly = document.getElementById("monthly");

function calculate(){
  const a = Number(amount.value);
  const t = Number(term.value);
  const rate = 0.08;

  const total = a + (a * rate);
  const perMonth = total / t;

  amountVal.textContent = "$" + a.toLocaleString();
  termVal.textContent = t + " months";
  monthly.textContent = "$" + perMonth.toFixed(2);
}

amount.addEventListener("input", calculate);
term.addEventListener("input", calculate);
calculate();

function applyNow(){
  localStorage.setItem("loanAmount", amount.value);
  window.location.href = "application.html";
}
</script>

</body>
</html>
