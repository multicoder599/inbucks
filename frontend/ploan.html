<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Processing Your Loan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#f2f2f2;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* CARD */
.card{
  background:#fff;
  width:100%;
  max-width:420px;
  padding:40px 28px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.15);
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* SPINNER */
.spinner-wrapper{
  width:90px;
  height:90px;
  margin:0 auto 20px;
  background:linear-gradient(135deg,#6d83f2,#7b4ee3);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 35px rgba(123,78,227,.55);
}

.spinner{
  width:36px;
  height:36px;
  border:4px solid rgba(255,255,255,.35);
  border-top:4px solid #fff;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* TEXT */
h1{
  font-size:24px;
  color:#6d83f2;
  margin-bottom:6px;
}

.subtitle{
  font-size:14px;
  color:#777;
  margin-bottom:24px;
}

/* PROGRESS */
.progress-box{
  margin-bottom:18px;
}

.progress-bar{
  height:8px;
  background:#e5e7eb;
  border-radius:10px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#6d83f2,#7b4ee3);
  border-radius:10px;
  animation:load 2s ease forwards;
}

@keyframes load{
  to{width:72%}
}

.percent{
  font-size:13px;
  margin-top:10px;
  color:#777;
}

/* INFO BOX */
.info{
  margin-top:18px;
  background:#f5f7ff;
  padding:14px;
  border-radius:14px;
  font-size:13px;
  color:#5b6bd5;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

/* FOOTER */
.footer{
  position:fixed;
  bottom:14px;
  width:100%;
  text-align:center;
  font-size:12px;
  color:#999;
}
</style>
</head>

<body>

<div class="card">
  <div class="spinner-wrapper">
    <div class="spinner"></div>
  </div>

  <h1>Processing Your Loan</h1>
  <p class="subtitle">Checking credit eligibility...</p>

  <div class="progress-box">
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="percent">72% Complete</div>
  </div>

  <div class="info">
    ⏱️ This usually takes a few seconds...
  </div>
</div>

<div class="footer">
  © 2025 EcoCash
</div>

<script>
setTimeout(()=>{
  // change destination if needed
  window.location.href = "success.html";
}, 4000);
</script>

</body>
</html>
