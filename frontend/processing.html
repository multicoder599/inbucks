<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Application Submitted</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#1f2235;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#fff;
}

/* TOAST */
.toast{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  background:#232744;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
  font-size:14px;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:slideDown .6s ease;
  border:1px solid rgba(255,255,255,.08);
}

@keyframes slideDown{
  from{opacity:0;transform:translate(-50%,-20px)}
  to{opacity:1;transform:translate(-50%,0)}
}

/* CARD */
.card{
  background:#232744;
  width:100%;
  max-width:420px;
  padding:38px 30px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 25px 60px rgba(0,0,0,.6);
  animation:fadeIn 1s ease;
  border:1px solid rgba(255,255,255,.08);
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}

/* CHECK ICON */
.check{
  width:80px;
  height:80px;
  margin:0 auto 18px;
  background:linear-gradient(135deg,#22c55e,#4ade80);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#022c22;
  font-size:38px;
  box-shadow:0 0 25px rgba(34,197,94,.7);
}

h1{
  color:#4ade80;
  font-size:26px;
  margin-bottom:12px;
}

p{
  font-size:14px;
  color:#cbd5f5;
  line-height:1.6;
  margin-bottom:18px;
}

/* LOADER */
.redirect{
  background:#1f2235;
  padding:14px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:14px;
  color:#4dabf7;
  border:1px solid rgba(255,255,255,.08);
}

.spinner{
  width:18px;
  height:18px;
  border:3px solid rgba(77,171,247,.3);
  border-top:3px solid #4dabf7;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* FOOTER */
.footer{
  position:fixed;
  bottom:14px;
  text-align:center;
  width:100%;
  font-size:12px;
  color:#8b93d6;
}
</style>
</head>

<body>

<div class="toast">
  ✅ 🎉 Application submitted successfully!
</div>

<div class="card">
  <div class="check">✓</div>

  <h1>Application Submitted</h1>

  <p>
    Your loan application has been successfully received.<br>
    Our team is reviewing it.
  </p>

  <p>
    You will get a confirmation message shortly.<br>
    Please proceed to InnBucks login.
  </p>

  <div class="redirect">
    <div class="spinner"></div>
    Redirecting to InnBucks login...
  </div>
</div>

<div class="footer">
  © 2025 InnBucks. All rights reserved.
</div>

<script>
setTimeout(()=>{
  window.location.href = "login.html";
}, 3500);
</script>

</body>
</html>
